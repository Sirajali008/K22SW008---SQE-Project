<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🎓</span>
        <div>
          <h1>Student Hub</h1>
          <p>Manage student records</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="connectionStatus" class="status-pill status-pending">Connecting…</span>
        <button id="themeToggle" class="btn btn-ghost" type="button" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main class="content">
      <div id="errorBanner" class="banner banner-error" role="alert" hidden></div>

      <section class="stats" aria-label="Summary">
        <article class="stat-card">
          <span class="stat-label">Total students</span>
          <strong id="statTotal">–</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Departments</span>
          <strong id="statDepts">–</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Average semester</span>
          <strong id="statAvg">–</strong>
        </article>
      </section>

      <section class="panel">
        <div class="toolbar">
          <div class="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="Search name, roll number or department" autocomplete="off" aria-label="Search students">
          </div>
          <select id="deptFilter" aria-label="Filter by department">
            <option value="">All departments</option>
          </select>
          <select id="semFilter" aria-label="Filter by semester">
            <option value="">All semesters</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>
          </select>
          <button id="refreshBtn" class="btn btn-ghost" type="button">Refresh</button>
          <button id="addBtn" class="btn btn-primary" type="button">+ Add student</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button class="sort-btn" data-sort="name" type="button">Name <span class="sort-icon"></span></button></th>
                <th><button class="sort-btn" data-sort="rollNo" type="button">Roll No <span class="sort-icon"></span></button></th>
                <th><button class="sort-btn" data-sort="department" type="button">Department <span class="sort-icon"></span></button></th>
                <th><button class="sort-btn" data-sort="semester" type="button">Semester <span class="sort-icon"></span></button></th>
                <th class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">📭</div>
          <h3 id="emptyTitle">No students yet</h3>
          <p id="emptyText">Add your first student to get started.</p>
        </div>

        <footer class="pagination">
          <span id="pageInfo">Showing 0 of 0</span>
          <div class="pager">
            <button id="prevPage" class="btn btn-ghost" type="button">Previous</button>
            <button id="nextPage" class="btn btn-ghost" type="button">Next</button>
          </div>
        </footer>
      </section>
    </main>
  </div>

  <!-- Add / Edit dialog -->
  <dialog id="studentDialog" class="dialog">
    <form id="studentForm" novalidate>
      <header class="dialog-header">
        <h2 id="dialogTitle">Add student</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
      </header>

      <div class="form-grid">
        <label class="field">
          <span>Full name</span>
          <input name="name" maxlength="100" autocomplete="off" placeholder="e.g. Ali Ahmed">
          <small class="field-error" data-error="name"></small>
        </label>
        <label class="field">
          <span>Roll number</span>
          <input name="rollNo" maxlength="32" autocomplete="off" placeholder="e.g. K26SW001">
          <small class="field-error" data-error="rollNo"></small>
        </label>
        <label class="field field-full">
          <span>Department</span>
          <input name="department" maxlength="100" list="deptList" autocomplete="off" placeholder="e.g. Software Engineering">
          <datalist id="deptList"></datalist>
          <small class="field-error" data-error="department"></small>
        </label>
        <label class="field">
          <span>Semester</span>
          <select name="semester">
            <option value="">Select semester</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
          <small class="field-error" data-error="semester"></small>
        </label>
      </div>

      <div id="formError" class="banner banner-error" role="alert" hidden></div>

      <footer class="dialog-footer">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button id="saveBtn" type="submit" class="btn btn-primary">Save student</button>
      </footer>
    </form>
  </dialog>

  <!-- Details dialog -->
  <dialog id="detailDialog" class="dialog">
    <header class="dialog-header">
      <div class="detail-title">
        <span id="detailAvatar" class="avatar avatar-lg"></span>
        <div>
          <h2 id="detailName">Student</h2>
          <p id="detailRoll" class="muted"></p>
        </div>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <dl class="detail-list">
      <div><dt>Department</dt><dd id="detailDept">–</dd></div>
      <div><dt>Semester</dt><dd id="detailSem">–</dd></div>
      <div><dt>Record ID</dt><dd id="detailId">–</dd></div>
    </dl>
    <footer class="dialog-footer">
      <button id="detailDelete" type="button" class="btn btn-danger-ghost">Delete</button>
      <button id="detailEdit" type="button" class="btn btn-primary">Edit</button>
    </footer>
  </dialog>

  <!-- Delete confirmation dialog -->
  <dialog id="confirmDialog" class="dialog dialog-small">
    <header class="dialog-header">
      <h2>Delete student?</h2>
    </header>
    <p id="confirmText" class="confirm-text"></p>
    <footer class="dialog-footer">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button id="confirmDelete" type="button" class="btn btn-danger">Delete</button>
    </footer>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
